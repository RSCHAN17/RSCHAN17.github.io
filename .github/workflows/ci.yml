name: Gigs Pipeline CI/CD

on:
  push:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs: 
  test_and_fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/server/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          cd server/
          npm ci 

      - name: Fetch latest Gigs
        env:
          CLICHES_API_KEY: ${{ secrets.CLICHES_API_KEY }}
        run: |
          cd server/
          node fetchdata.js

      - name: Commit gigs data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/data/ . || true
          git commit -m "ci: update gig data" || echo "No changes to commit"
          git push || echo "Push failed or no changes"

      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          
        

